[project]
name = "opwater"
version = "0.1.0"
description = "Helper code for teaching notebooks on modelling and optimization of water distribution systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bradley Jenks" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "networkx",
    "wntr",
]

# Installed by `uv sync` for local use; left out of `pip install` so Colab keeps its own Jupyter.
[dependency-groups]
jupyter = [
    "jupyterlab",
    "ipykernel",
]
dev = [
    "ruff",
    "nbstripout",
]

[tool.uv]
default-groups = ["jupyter", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opwater"]

[tool.ruff]
line-length = 110
